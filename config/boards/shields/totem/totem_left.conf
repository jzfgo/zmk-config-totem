# La central consulta el nivel de batería de la periférica (FETCHING) y lo
# re-publica como un segundo servicio GATT de batería (PROXY), visible con
# apps/exploradores BLE; el indicador nativo de macOS solo muestra el primero.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
