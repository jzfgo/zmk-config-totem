# The central fetches the peripheral's battery level (FETCHING) and re-publishes
# it as a second GATT battery service (PROXY), visible with BLE apps/explorers;
# the native macOS indicator only shows the first one.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
